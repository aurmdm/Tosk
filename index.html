<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>아실 매물 크롤러</title>
<style>
  :root{
    --navy:#122240;
    --navy-2:#1c3358;
    --mint:#22b285;
    --mint-dim:#1a8a68;
    --paper:#f4f6f8;
    --card:#ffffff;
    --line:#e1e6ec;
    --ink:#1a2333;
    --sub:#5c6a7d;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  header{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:28px 20px 60px;
    position:relative;
    overflow:hidden;
  }
  header .skyline{
    position:absolute; left:0; right:0; bottom:0; height:34px;
    display:flex; align-items:flex-end; gap:3px; padding:0 16px;
    opacity:.35;
  }
  header .skyline span{
    display:block; width:8px; background:var(--mint); border-radius:1px 1px 0 0;
  }
  header h1{
    margin:0 0 6px; font-size:21px; font-weight:800; letter-spacing:-0.02em;
  }
  header p{
    margin:0; font-size:13px; color:#c7d3e3; line-height:1.5;
  }
  .wrap{
    max-width:520px; margin:-34px auto 0; padding:0 16px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:14px; box-shadow:0 8px 24px rgba(18,34,64,.06);
  }
  .card h2{
    font-size:13px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--sub); margin:0 0 12px; font-weight:700;
  }
  .seg{
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
  }
  .seg label{
    text-align:center; font-size:13px; font-weight:600; color:var(--sub);
    border:1px solid var(--line); border-radius:9px; padding:9px 4px;
    cursor:pointer; transition:.15s;
  }
  .seg input{position:absolute; opacity:0; pointer-events:none;}
  .seg input:checked + label{
    background:var(--navy); border-color:var(--navy); color:#fff;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:5px; font-weight:600;}
  .field input[type=month]{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px;
    font-size:14px; color:var(--ink); background:#fbfcfd;
  }
  .startbtn{
    width:100%; padding:15px; margin-top:16px; border:none; border-radius:12px;
    background:var(--mint); color:#fff; font-size:15px; font-weight:800;
    letter-spacing:-0.01em; cursor:pointer; transition:.15s;
  }
  .startbtn:active{transform:scale(.98); background:var(--mint-dim);}
  .startbtn:disabled{background:#a9b4c2; cursor:default;}
  #progressCard{display:none;}
  .barOuter{
    height:8px; background:#e9edf2; border-radius:6px; overflow:hidden; margin-bottom:10px;
  }
  .barInner{
    height:100%; width:0%; background:linear-gradient(90deg,var(--mint),var(--mint-dim));
    transition:width .25s;
  }
  #progressText{font-size:13px; color:var(--sub); margin:0;}
  #progressText b{color:var(--ink);}
  .log{
    margin-top:10px; max-height:120px; overflow-y:auto; font-size:12px;
    color:var(--sub); border-top:1px dashed var(--line); padding-top:8px;
  }
  .log div{padding:2px 0;}
  .log .warn{color:var(--danger);}
  #resultCard{display:none;}
  table.summary{width:100%; border-collapse:collapse; font-size:13px;}
  table.summary th{
    text-align:right; font-size:11px; color:var(--sub); font-weight:700;
    border-bottom:2px solid var(--navy); padding:6px 4px;
  }
  table.summary th:first-child, table.summary th:nth-child(2){text-align:left;}
  table.summary td{
    text-align:right; padding:7px 4px; border-bottom:1px solid var(--line);
  }
  table.summary td:first-child{text-align:center; color:var(--sub);}
  table.summary td:nth-child(2){text-align:left; font-weight:700;}
  table.summary tr:nth-child(odd){background:#fafbfc;}
  .downloadbtn{
    display:block; width:100%; text-align:center; padding:15px; margin-top:16px;
    border-radius:12px; background:var(--navy); color:#fff; font-weight:800;
    font-size:15px; text-decoration:none;
  }
  .downloadbtn:active{background:var(--navy-2);}
  .note{
    font-size:12px; color:var(--sub); line-height:1.6; margin-top:10px;
  }
  .note b{color:var(--ink);}
  footer{
    max-width:520px; margin:6px auto 0; padding:0 20px; font-size:11px; color:#9aa5b3; line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <h1>서울 아파트 매물 크롤러</h1>
  <p>아실(asil.kr) 자치구별 매물 데이터를 수집해 엑셀로 저장합니다.<br>옵션 선택 후 버튼 한 번이면 끝나요.</p>
  <div class="skyline" id="skyline"></div>
</header>

<div class="wrap">

  <div class="card">
    <h2>거래 유형</h2>
    <div class="seg" id="dealSeg">
      <input type="radio" name="deal" id="d123" value="123" checked><label for="d123">전체</label>
      <input type="radio" name="deal" id="d1" value="1"><label for="d1">매매</label>
      <input type="radio" name="deal" id="d2" value="2"><label for="d2">전세</label>
      <input type="radio" name="deal" id="d3" value="3"><label for="d3">월세</label>
    </div>

    <div class="row2">
      <div class="field">
        <label for="startMonth">시작 연월</label>
        <input type="month" id="startMonth" value="2023-01">
      </div>
      <div class="field">
        <label for="endMonth">종료 연월</label>
        <input type="month" id="endMonth">
      </div>
    </div>

    <button class="startbtn" id="startBtn">크롤링 시작 · 엑셀 만들기</button>
  </div>

  <div class="card" id="progressCard">
    <h2>수집 진행 상황</h2>
    <div class="barOuter"><div class="barInner" id="barInner"></div></div>
    <p id="progressText">대기 중…</p>
    <div class="log" id="log"></div>
  </div>

  <div class="card" id="resultCard">
    <h2>최신 매물 현황 (구별)</h2>
    <table class="summary" id="summaryTable"></table>
    <a href="#" class="downloadbtn" id="downloadBtn">엑셀 파일 다운로드</a>
    <p class="note"><b>참고</b> — 아실 서버가 다른 도메인의 직접 요청을 막아둔 경우, 공개 프록시를 자동으로 거쳐 수집합니다. 그래도 실패하는 구가 있으면 자동으로 2회까지 재시도합니다.</p>
  </div>

</div>

<footer>
  데이터 출처: asil.kr · 이 페이지는 브라우저에서 직접 데이터를 수집하며 서버로 전송/저장하지 않습니다.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ── 스카이라인 장식 ─────────────────────────────────────────
(function(){
  const el = document.getElementById('skyline');
  let html = '';
  for (let i=0;i<28;i++){
    const h = 6 + Math.round(Math.random()*28);
    html += `<span style="height:${h}px"></span>`;
  }
  el.innerHTML = html;
})();

// ── 상수 (원본 파이썬 스크립트와 동일) ─────────────────────
const API_URL = "https://asil.kr/app/data/data_offer_sum.jsp";
const SEOUL_GU = {
  "11110":"종로구","11140":"중구","11170":"용산구",
  "11200":"성동구","11215":"광진구","11230":"동대문구",
  "11260":"중랑구","11290":"성북구","11305":"강북구",
  "11320":"도봉구","11350":"노원구","11380":"은평구",
  "11410":"서대문구","11440":"마포구","11470":"양천구",
  "11500":"강서구","11530":"구로구","11545":"금천구",
  "11560":"영등포구","11590":"동작구","11620":"관악구",
  "11650":"서초구","11680":"강남구","11710":"송파구",
  "11740":"강동구"
};
const DEAL_LABELS = {"1":"매매","2":"전세","3":"월세","123":"전체"};

// 종료 연월 기본값 = 이번 달
(function(){
  const now = new Date();
  const ym = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('endMonth').value = ym;
})();

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function dealCols(deal){
  if (deal==="1") return ["매매"];
  if (deal==="2") return ["전세"];
  if (deal==="3") return ["월세"];
  return ["매매","전세","월세"];
}

function safeInt(v){
  const n = parseInt(v, 10);
  return isNaN(n) ? 0 : Math.max(0, n);
}

function parseDate(d){
  const parts = String(d).trim().split(/[\/\-.]/);
  if (parts.length===3){
    let [y,m,day] = parts;
    if (y.length===2) y = "20"+y;
    const mm = String(parseInt(m,10)).padStart(2,'0');
    const dd = String(parseInt(day,10)).padStart(2,'0');
    const iso = `${y}-${mm}-${dd}`;
    const t = Date.parse(iso);
    if (isNaN(t)) return null;
    return iso;
  }
  return null;
}

function parseAsilResponse(raw){
  raw = (raw||"").trim();
  let data = [];
  if (raw.startsWith("[")){
    try { data = JSON.parse(raw); } catch(e){ data = []; }
  } else if (raw.includes("chartData[")){
    const re = /chartData\[\d+\]=(\{[^;]+\})/g;
    let m;
    while ((m = re.exec(raw)) !== null){
      try { data.push(JSON.parse(m[1])); } catch(e){}
    }
  } else {
    const m2 = raw.match(/=\s*(\[[\s\S]+\])/);
    if (m2){
      try { data = JSON.parse(m2[1]); } catch(e){ data = []; }
    }
  }
  return data;
}

// ── CORS 우회 다단계 시도 (allorigins는 원본 Referer를 흉내낼 수 있는 방식 사용) ─
async function fetchWithFallback(url, diag){
  const withReferer = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
  const attempts = [
    {name:"direct",     run:() => fetch(url, {method:"GET"}).then(r=>({ok:r.ok, status:r.status, text:null, p:r.text()}))},
    {name:"corsfix",    run:() => fetch("https://proxy.corsfix.com/?"+url, {method:"GET"}).then(r=>({ok:r.ok, status:r.status, text:null, p:r.text()}))},
    {name:"x2u",        run:() => fetch("https://cors.x2u.in/"+url, {method:"GET"}).then(r=>({ok:r.ok, status:r.status, text:null, p:r.text()}))},
    {name:"allorigins", run:() => fetch(withReferer, {method:"GET"}).then(r=>({ok:r.ok, status:r.status, text:null, p:r.text()}))},
    {name:"corsproxy",  run:() => fetch("https://corsproxy.io/?url="+encodeURIComponent(url), {method:"GET"}).then(r=>({ok:r.ok, status:r.status, text:null, p:r.text()}))},
    {name:"codetabs",   run:() => fetch("https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url), {method:"GET"}).then(r=>({ok:r.ok, status:r.status, text:null, p:r.text()}))},
  ];
  for (const attempt of attempts){
    try {
      const res = await attempt.run();
      const text = await res.p;
      if (!res.ok){
        diag.push(`${attempt.name}: HTTP ${res.status}`);
        continue;
      }
      if (text && text.trim().length > 0){
        diag.push(`${attempt.name}: 응답 ${text.length}자 — "${text.slice(0,60).replace(/\s+/g,' ')}"`);
        return text;
      } else {
        diag.push(`${attempt.name}: 빈 응답`);
      }
    } catch(e){
      diag.push(`${attempt.name}: 오류 — ${e.message || e}`);
    }
  }
  return null;
}

async function fetchOneGu(code, name, deal, sY, sM, eY, eM, verbose){
  const params = new URLSearchParams({
    t: Date.now(), apt:"", area: code, c_apt:"", c_area:"",
    c_apt2:"", c_area2:"", deal: deal, mode:"2",
    sSize:"", eSize:"", sY, sM, eY, eM
  });
  const url = `${API_URL}?${params.toString()}`;

  const diag = [];
  let raw = await fetchWithFallback(url, diag);
  if (verbose){
    diag.forEach(d => logLine(`  · ${d}`, !raw));
  }
  if (!raw) return [];

  const data = parseAsilResponse(raw);
  if (verbose && data.length === 0){
    logLine(`  · 응답은 받았지만 파싱된 항목 0개 (형식이 예상과 다름)`, true);
  }
  const rows = [];
  for (const item of data){
    const dateStr = parseDate(item.Date ?? item.date ?? "");
    if (!dateStr) continue;
    const row = {date: dateStr, gu_name: name, area_code: code, 매매:0, 전세:0, 월세:0};
    if (deal==="1") row.매매 = safeInt(item.VM);
    else if (deal==="2") row.전세 = safeInt(item.VJ);
    else if (deal==="3") row.월세 = safeInt(item.VW);
    else { row.매매=safeInt(item.VM); row.전세=safeInt(item.VJ); row.월세=safeInt(item.VW); }
    rows.push(row);
  }
  return rows;
}

// ── 엑셀 빌드 ──────────────────────────────────────────────
function buildWorkbook(allRows, deal){
  const cols = dealCols(deal);
  const wb = XLSX.utils.book_new();

  // 1) 원본데이터
  const rawHeader = ["날짜","자치구","지역코드", ...cols.map(c=>c+" 매물수")];
  const rawRows = [...allRows].sort((a,b)=>{
    if (a.gu_name !== b.gu_name) return a.gu_name < b.gu_name ? -1 : 1;
    return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
  });
  const rawAOA = [rawHeader, ...rawRows.map(r => [r.date, r.gu_name, r.area_code, ...cols.map(c=>r[c])])];
  const wsRaw = XLSX.utils.aoa_to_sheet(rawAOA);
  wsRaw['!cols'] = [{wch:12},{wch:10},{wch:10}, ...cols.map(()=>({wch:12}))];
  XLSX.utils.book_append_sheet(wb, wsRaw, "원본데이터");

  // 2) 요약_최신현황 (구별 최신일자 데이터, 합계 내림차순)
  const byGu = {};
  for (const r of allRows){
    if (!byGu[r.gu_name] || r.date > byGu[r.gu_name].date) byGu[r.gu_name] = r;
  }
  let latestList = Object.values(byGu).map(r => ({...r, _total: cols.reduce((s,c)=>s+r[c],0)}));
  latestList.sort((a,b)=>b._total - a._total);

  const sumHeader = ["순위","자치구","최신날짜", ...cols.map(c=>c+" 매물수")];
  const sumAOA = [sumHeader];
  latestList.forEach((r,i)=> sumAOA.push([i+1, r.gu_name, r.date, ...cols.map(c=>r[c])]));
  const totalRow = ["합계","",""].concat(cols.map(c => latestList.reduce((s,r)=>s+r[c],0)));
  sumAOA.push(totalRow);
  const wsSum = XLSX.utils.aoa_to_sheet(sumAOA);
  wsSum['!cols'] = [{wch:6},{wch:12},{wch:14}, ...cols.map(()=>({wch:12}))];
  XLSX.utils.book_append_sheet(wb, wsSum, "요약_최신현황");

  // 3) 일별피벗_컬럼별
  for (const col of cols){
    const dateSet = new Set();
    const guSet = new Set();
    for (const r of allRows){ dateSet.add(r.date); guSet.add(r.gu_name); }
    const dates = [...dateSet].sort().reverse();
    const gus = [...guSet].sort();
    const idx = {};
    for (const r of allRows){
      const key = r.date+"|"+r.gu_name;
      idx[key] = (idx[key]||0) + r[col];
    }
    const header = ["날짜", ...gus, "합계"];
    const aoa = [header];
    for (const d of dates){
      const rowVals = gus.map(g => idx[d+"|"+g] || 0);
      const sum = rowVals.reduce((s,v)=>s+v,0);
      aoa.push([d, ...rowVals, sum]);
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:12}, ...gus.map(()=>({wch:9})), {wch:10}];
    let sheetName = `일별피벗_${col}`;
    if (sheetName.length > 31) sheetName = sheetName.slice(0,31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  }

  return wb;
}

function renderSummaryTable(allRows, deal){
  const cols = dealCols(deal);
  const byGu = {};
  for (const r of allRows){
    if (!byGu[r.gu_name] || r.date > byGu[r.gu_name].date) byGu[r.gu_name] = r;
  }
  let list = Object.values(byGu).map(r => ({...r, _total: cols.reduce((s,c)=>s+r[c],0)}));
  list.sort((a,b)=>b._total - a._total);

  const table = document.getElementById('summaryTable');
  let html = `<tr><th>#</th><th>자치구</th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>`;
  list.forEach((r,i)=>{
    html += `<tr><td>${i+1}</td><td>${r.gu_name}</td>${cols.map(c=>`<td>${r[c].toLocaleString()}</td>`).join("")}</tr>`;
  });
  table.innerHTML = html;
}

// ── 메인 실행 흐름 ─────────────────────────────────────────
const startBtn = document.getElementById('startBtn');
const progressCard = document.getElementById('progressCard');
const resultCard = document.getElementById('resultCard');
const barInner = document.getElementById('barInner');
const progressText = document.getElementById('progressText');
const logEl = document.getElementById('log');

function logLine(text, warn){
  const div = document.createElement('div');
  if (warn) div.className = 'warn';
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

startBtn.addEventListener('click', async () => {
  const deal = document.querySelector('input[name=deal]:checked').value;
  const [sYs, sMs] = document.getElementById('startMonth').value.split('-');
  const [eYs, eMs] = document.getElementById('endMonth').value.split('-');
  if (!sYs || !eYs){ alert('시작/종료 연월을 선택해주세요.'); return; }
  const sY = parseInt(sYs,10), sM = parseInt(sMs,10), eY = parseInt(eYs,10), eM = parseInt(eMs,10);

  startBtn.disabled = true;
  startBtn.textContent = '수집 중…';
  progressCard.style.display = 'block';
  resultCard.style.display = 'none';
  logEl.innerHTML = '';
  barInner.style.width = '0%';

  const entries = Object.entries(SEOUL_GU);
  const allRows = [];
  let done = 0;

  for (const [code, name] of entries){
    progressText.innerHTML = `<b>${name}</b> 수집 중… (${done+1}/${entries.length})`;
    const verbose = done < 2; // 처음 2개 구는 진단 로그를 자세히 남김
    const rows = await fetchOneGu(code, name, deal, sY, sM, eY, eM, verbose);
    if (rows.length){
      allRows.push(...rows);
      logLine(`${name} → ${rows.length}건 (${rows[0].date} ~ ${rows[rows.length-1].date})`);
    } else {
      logLine(`${name} → 데이터 없음`, true);
    }
    done++;
    barInner.style.width = Math.round(done/entries.length*100) + '%';
    await sleep(250);
  }

  progressText.innerHTML = `<b>완료</b> — 총 ${allRows.length.toLocaleString()}건 수집`;

  if (allRows.length === 0){
    logLine('수집된 데이터가 없습니다. 네트워크 상태를 확인하고 다시 시도해주세요.', true);
    startBtn.disabled = false;
    startBtn.textContent = '다시 시도';
    return;
  }

  renderSummaryTable(allRows, deal);
  const wb = buildWorkbook(allRows, deal);
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const label = DEAL_LABELS[deal] || deal;
  const ts = new Date();
  const tsStr = ts.getFullYear() + String(ts.getMonth()+1).padStart(2,'0') + String(ts.getDate()).padStart(2,'0')
    + '_' + String(ts.getHours()).padStart(2,'0') + String(ts.getMinutes()).padStart(2,'0') + String(ts.getSeconds()).padStart(2,'0');
  const filename = `서울_매물통계_${label}_${tsStr}.xlsx`;

  const url = URL.createObjectURL(blob);
  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.href = url;
  downloadBtn.download = filename;
  downloadBtn.textContent = `엑셀 다운로드 (${filename})`;

  resultCard.style.display = 'block';
  startBtn.disabled = false;
  startBtn.textContent = '다시 크롤링하기';
});
</script>
</body>
</html>
